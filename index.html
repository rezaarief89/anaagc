<!doctype html>
<html lang="id">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width,initial-scale=1" />
      <meta name="theme-color" content="#fffdf8" />
      <title>ANA Agency | Viral, Rame, Closing</title>
      <meta
         name="description"
         content="Layanan buzzer sosial media serta KOL dan influencer dari ANA Agency."
      />
      <link
         rel="preload"
         as="image"
         href="assets/mobile-fixed/hero-visual.webp"
         media="(max-width:640px)"
      />
      <link rel="stylesheet" href="styles.css" />
      <link rel="stylesheet" href="mobile-fixed.css" />
   </head>
   <body>
      <div class="site">
         <div class="desktop">
            <section class="slice" id="desktop-home">
               <picture>
                  <source
                     srcset="
                        assets/01-header-hero.webp    1x,
                        assets/01-header-hero@2x.webp 2x
                     "
                     type="image/webp"
                  />
                  <img
                     src="assets/01-header-hero@2x.png"
                     width="864"
                     alt="ANA Agency, semua bermula dari viral"
                     fetchpriority="high"
                     decoding="sync"
                  />
               </picture>
            </section>
            <section class="slice" id="desktop-layanan">
               <picture>
                  <source
                     srcset="
                        assets/02-services.webp    1x,
                        assets/02-services@2x.webp 2x
                     "
                     type="image/webp"
                  />
                  <img
                     src="assets/02-services@2x.png"
                     width="864"
                     alt="Layanan ANA Agency"
                     loading="lazy"
                     decoding="async"
                  />
               </picture>
            </section>
            <section class="slice" id="desktop-testimoni">
               <picture>
                  <source
                     srcset="
                        assets/03-testimonials.webp    1x,
                        assets/03-testimonials@2x.webp 2x
                     "
                     type="image/webp"
                  />
                  <img
                     src="assets/03-testimonials@2x.png"
                     width="864"
                     alt="Testimoni klien ANA Agency"
                     loading="lazy"
                     decoding="async"
                  />
               </picture>
            </section>
            <section class="slice" id="desktop-brand">
               <picture>
                  <source
                     srcset="
                        assets/04-brand-strip.webp    1x,
                        assets/04-brand-strip@2x.webp 2x
                     "
                     type="image/webp"
                  />
                  <img
                     src="assets/04-brand-strip@2x.png"
                     width="864"
                     alt="Brand klien ANA Agency"
                     loading="lazy"
                     decoding="async"
                  />
               </picture>
            </section>
            <section class="slice" id="desktop-cara-kerja">
               <picture>
                  <source
                     srcset="
                        assets/05-workflow.webp    1x,
                        assets/05-workflow@2x.webp 2x
                     "
                     type="image/webp"
                  />
                  <img
                     src="assets/05-workflow@2x.png"
                     width="864"
                     alt="Cara kerja ANA Agency"
                     loading="lazy"
                     decoding="async"
                  />
               </picture>
            </section>
            <section class="slice" id="desktop-konsultasi">
               <picture>
                  <source
                     srcset="assets/06-cta.webp 1x, assets/06-cta@2x.webp 2x"
                     type="image/webp"
                  />
                  <img
                     src="assets/06-cta@2x.png"
                     width="864"
                     alt="Konsultasi gratis"
                     loading="lazy"
                     decoding="async"
                  />
               </picture>
               <a
                  class="hotspot"
                  href="#whatsapp"
                  aria-label="Konsultasi WhatsApp"
                  style="left: 31%; top: 68%; width: 38%; height: 22%"
               ></a>
            </section>
            <section class="slice" id="desktop-footer">
               <picture>
                  <source
                     srcset="
                        assets/07-footer.webp    1x,
                        assets/07-footer@2x.webp 2x
                     "
                     type="image/webp"
                  />
                  <img
                     src="assets/07-footer@2x.png"
                     width="864"
                     alt="Footer ANA Agency"
                     loading="lazy"
                     decoding="async"
                  />
               </picture>
               <a
                  class="hotspot"
                  href="https://tiktok.com/@ana.agencyofficial"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="TikTok"
                  style="left: 18%; top: 0; width: 31%; height: 100%"
               ></a
               ><a
                  class="hotspot"
                  href="https://www.instagram.com/anaagencyofficial"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Instagram"
                  style="left: 49%; top: 0; width: 43%; height: 100%"
               ></a>
            </section>
         </div>
      </div>
      <div class="mobile">
         <header class="m-header">
            <a
               href="#mobile-home"
               class="m-logo-link"
               aria-label="ANA Agency, home"
               ><img
                  class="m-logo"
                  src="assets/mobile-fixed/logo.png"
                  alt="ANA Agency"
            /></a>
            <button
               class="m-menu"
               type="button"
               aria-expanded="false"
               aria-controls="mobile-nav"
               aria-label="Buka menu navigasi"
            >
               <span></span><span></span><span></span>
            </button>
            <span class="m-spacer"></span
            ><a class="m-wa" href="#mobile-whatsapp">KONSULTASI GRATIS</a>
            <nav class="m-nav" id="mobile-nav" aria-label="Navigasi mobile">
               <a href="#mobile-home">HOME</a
               ><a href="#mobile-layanan">LAYANAN</a
               ><a href="#mobile-testimoni">TESTIMONI</a
               ><a href="#mobile-cara-kerja">CARA KERJA</a>
            </nav>
         </header>
         <main>
            <section class="m-hero" id="mobile-home">
               <div class="hero-visual-top">
                  <picture
                     ><source
                        srcset="assets/mobile-fixed/hero-visual.webp"
                        type="image/webp" />
                     <img
                        src="assets/mobile-fixed/hero-visual.png"
                        alt="Konten viral bersama ANA Agency"
                  /></picture>
               </div>
            </section>
            <section class="m-section" id="mobile-layanan">
               <picture
                  ><source
                     srcset="assets/mobile-fixed/services-title.webp"
                     type="image/webp" />
                  <img
                     class="section-title"
                     src="assets/mobile-fixed/services-title.png"
                     alt="Layanan kami"
               /></picture>
               <div class="stack">
                  <picture
                     ><source
                        srcset="assets/mobile-fixed/service-buzzer.webp"
                        type="image/webp" />
                     <img
                        class="asset-card"
                        src="assets/mobile-fixed/service-buzzer.png"
                        alt="Sewa buzzer sosial media" /></picture
                  ><picture
                     ><source
                        srcset="assets/mobile-fixed/service-kol.webp"
                        type="image/webp" />
                     <img
                        class="asset-card kol-card"
                        src="assets/mobile-fixed/service-kol.png"
                        alt="Sewa KOL atau influencer"
                  /></picture>
               </div>
            </section>
            <section class="m-section testimonials" id="mobile-testimoni">
               <picture
                  ><source
                     srcset="assets/mobile-fixed/testimonials-title.webp"
                     type="image/webp" />
                  <img
                     class="section-title"
                     src="assets/mobile-fixed/testimonials-title.png"
                     alt="Kata mereka"
               /></picture>
               <div class="stack">
                  <picture
                     ><source
                        srcset="assets/mobile-fixed/testimonial-buzzer.webp"
                        type="image/webp" />
                     <img
                        class="testimonial-card"
                        src="assets/mobile-fixed/testimonial-buzzer.png"
                        alt="Testimoni buzzer sosial media" /></picture
                  ><picture
                     ><source
                        srcset="assets/mobile-fixed/testimonial-kol.webp"
                        type="image/webp" />
                     <img
                        class="testimonial-card"
                        src="assets/mobile-fixed/testimonial-kol.png"
                        alt="Testimoni KOL dan influencer"
                  /></picture>
               </div>
            </section>
            <section class="brands-wrap" aria-label="Brand klien">
               <picture
                  ><source
                     srcset="assets/04-brand-strip@2x.webp"
                     type="image/webp" />
                  <img
                     class="brands"
                     src="assets/04-brand-strip@2x.png"
                     alt="Brand yang sudah percaya kepada ANA Agency"
               /></picture>
            </section>
            <section class="m-section workflow" id="mobile-cara-kerja">
               <picture
                  ><source
                     srcset="assets/05-workflow@2x.webp"
                     type="image/webp" />
                  <img
                     class="workflow-image"
                     src="assets/05-workflow@2x.png"
                     alt="Cara kerja ANA Agency"
               /></picture>
            </section>
            <section class="m-cta" id="mobile-whatsapp">
               <picture
                  ><source
                     srcset="assets/mobile-fixed/cta.webp"
                     type="image/webp" />
                  <img
                     class="cta-image"
                     src="assets/mobile-fixed/cta.png"
                     alt="Konsultasi strategi gratis" /></picture
               ><a
                  class="cta-hit"
                  href="#whatsapp"
                  aria-label="Konsultasi melalui WhatsApp"
               ></a>
            </section>
            <footer class="m-footer">
               <picture
                  ><source
                     srcset="assets/mobile-fixed/footer.webp"
                     type="image/webp" />
                  <img
                     class="footer-image"
                     src="assets/mobile-fixed/footer.png"
                     alt="TikTok dan Instagram ANA Agency" /></picture
               ><a
                  class="social tiktok"
                  href="https://tiktok.com/@ana.agencyofficial"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="TikTok"
               ></a
               ><a
                  class="social instagram"
                  href="https://www.instagram.com/anaagencyofficial"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Instagram"
               ></a>
            </footer>
         </main>
      </div>
      <script>
         const wa =
            "https://wa.me/6285881770512?text=" +
            encodeURIComponent(
               "Halo, saya ingin konsultasi strategi untuk brand saya.",
            );
         document
            .querySelectorAll('a[href="#whatsapp"], a[href="#mobile-whatsapp"]')
            .forEach((a) => (a.href = wa));
         const menu = document.querySelector(".m-menu");
         const nav = document.querySelector(".m-nav");
         if (menu && nav) {
            menu.addEventListener("click", () => {
               const open = menu.getAttribute("aria-expanded") === "true";
               menu.setAttribute("aria-expanded", String(!open));
               nav.classList.toggle("open", !open);
            });
            nav.querySelectorAll("a").forEach((a) =>
               a.addEventListener("click", () => {
                  menu.setAttribute("aria-expanded", "false");
                  nav.classList.remove("open");
               }),
            );
         }
      </script>
   </body>
</html>
